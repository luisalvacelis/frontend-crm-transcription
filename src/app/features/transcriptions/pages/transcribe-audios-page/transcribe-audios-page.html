<div class="bg-base-50">
  <div class="container mx-auto px-6 py-6 max-w-7xl">
    <div class="mb-6">
      <div class="flex items-center gap-4 mb-4">
        <button type="button" class="btn btn-ghost btn-sm btn-circle" (click)="goBack()" title="Volver">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
          </svg>
        </button>

        <div class="flex-1">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-2xl font-bold text-base-content">Transcribir Audios</h1>
              <p class="text-sm text-base-content/60 mt-1">
                Selecciona una opción para transcribir / cancelar
              </p>
            </div>

            <button type="button" class="btn btn-outline btn-sm" routerLink="/transcriptions/audios">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              Upload
            </button>
          </div>
        </div>
      </div>

      @if (campaign()) {
      <div class="flex items-center gap-2 ml-12">
        <span class="badge badge-lg badge-primary badge-outline">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          {{ campaign()?.name }}
        </span>
        <span class="badge badge-sm badge-ghost">{{ campaign()?.total_audios }} audios</span>
        @if (campaign()?.status) {
        <span class="badge badge-sm" [class.badge-success]="campaign()?.status === 'DONE'"
          [class.badge-warning]="campaign()?.status === 'PARTIAL'"
          [class.badge-info]="campaign()?.status === 'PENDING'">
          {{ campaign()?.status }}
        </span>
        }
      </div>
      }
    </div>

    @if (campaign()) {
    <div class="space-y-6">
      <app-transcribe-options [campaign]="campaign()" [isModalOpen]="isPageActive()"></app-transcribe-options>
      <app-transcribed-audios [campaign]="campaign()"></app-transcribed-audios>
    </div>
    } @else {
    <div class="flex flex-col items-center justify-center py-12">
      <span class="loading loading-spinner loading-lg text-primary"></span>
      <p class="mt-4 text-base-content/60">Cargando información de la campaña...</p>
    </div>
    }

  </div>
</div>
