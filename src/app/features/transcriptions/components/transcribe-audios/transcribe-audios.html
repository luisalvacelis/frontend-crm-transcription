<dialog #dlg class="modal">

  <div class="modal-box w-11/12 max-w-3xl p-0 overflow-hidden">
    <div class="p-5 border-b border-base-200 flex items-start justify-between gap-4">
      <div class="min-w-0">
        <h3 class="text-lg font-bold text-base-content">Trancribir Audios</h3>
        <p class="text-sm text-base-content/60 mt-0.5">
          Selecciona una opción para transcribir / pausar / cancelar
        </p>
      </div>

      <div class="shrink-0">
        <span class="badge badge-primary badge-outline">Upload</span>
      </div>
    </div>

    <div class="p-5">
      <app-transcribe-options></app-transcribe-options>
      <app-transcribed-audios></app-transcribed-audios>
    </div>

    <div class="mt-6 flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
      <form method="dialog" class="sm:mr-auto">
        <button class="btn btn-ghost w-full sm:w-auto" (click)="close()">Cancelar</button>
      </form>
    </div>
  </div>

  <form method="dialog" class="modal">
    <button aria-label="Cerrar">close</button>
  </form>
</dialog>
